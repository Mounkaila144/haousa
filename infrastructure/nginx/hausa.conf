# Routes Hausa chargées dans le vhost TLS existant `ia-ptrniger.duckdns.org`.
# Le préfixe public est retiré avant transmission à FastAPI :
#   /hausa/api/v1/... -> /api/v1/...

location = /hausa {
    return 301 /hausa/;
}

location = /hausa/privacy {
    alias /opt/hausa/docs/play-store/privacy-policy.html;
    default_type text/html;
    expires 1h;
}

location = /hausa/health {
    proxy_pass http://127.0.0.1:8010/health;
    include /etc/nginx/proxy_params;
}

location /hausa/api/v1/recognize {
    limit_req zone=hausa_api burst=10 nodelay;
    limit_req_status 429;
    rewrite ^/hausa(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:8010;
    include /etc/nginx/proxy_params;
}

location /hausa/ {
    rewrite ^/hausa(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:8010;
    include /etc/nginx/proxy_params;
}
